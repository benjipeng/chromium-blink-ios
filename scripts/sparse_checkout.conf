# Git sparse-checkout (--no-cone) rules for chromium/src.git.
# Skips multi-GB test suites and docs before blob fetch while keeping
# //extensions, //components/crx_file, and //chrome/*/extensions intact,
# and preserving all GN/Grit/filelist build metadata across the tree.

/*

# Exclude Blink web/perf/manual test corpora (200k+ files).
!/third_party/blink/web_tests/
!/third_party/blink/perf_tests/
!/third_party/blink/manual_tests/

# Exclude heavy test media/data corpora.
!/chrome/test/data/
!/content/test/data/
!/media/test/data/
!/components/test/data/
!/net/data/
!/docs/

# Retain Chrome Root Store inputs under net/data/ssl/ required by //net:gen_root_store_inc.
/net/data/ssl/chrome_root_store/
/net/data/ssl/chrome_root_store/**

# Always retain build-graph, resource, and iOS bundle filelist metadata even
# inside excluded subtrees so GN `read_file()` / imports never fail at gen time.
**/*.gn
**/*.gni
**/*.grd
**/*.grdp
**/*.pydeps
**/*.filelist
**/*.globlist
**/DEPS
**/OWNERS
