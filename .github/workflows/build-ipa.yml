name: Build Chromium Blink iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Compile strategy: 'auto' runs the parallel shard farm on warm per-shard ccache; 'incremental' compiles inside the link job from the merged ccache"
        required: false
        type: choice
        options:
          - auto
          - incremental
        default: auto
      force_from:
        description: "Ignore stage checkpoints from this stage onward"
        required: false
        type: choice
        options:
          - none
          - stage1
          - codegen
          - shards
          - link
          - package
        default: none
      with_app_groups:
        description: "Ad-hoc sign IPA with App Group entitlements"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Publish built IPA to GitHub Releases"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-ipa
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  # Free plan: 20 concurrent jobs. 18 shards leave headroom for other runs.
  SHARD_COUNT: "18"

jobs:
  plan:
    name: Resolve Checkpoints & Execution Plan
    runs-on: ubuntu-24.04
    outputs:
      chromium_rev: ${{ steps.plan.outputs.chromium_rev }}
      chromium_version: ${{ steps.plan.outputs.chromium_version }}
      src_ref: ${{ steps.plan.outputs.src_ref }}
      stub_ref: ${{ steps.plan.outputs.stub_ref }}
      s1_ref: ${{ steps.plan.outputs.s1_ref }}
      s2a_ref: ${{ steps.plan.outputs.s2a_ref }}
      shards_ref: ${{ steps.plan.outputs.shards_ref }}
      s3_ref: ${{ steps.plan.outputs.s3_ref }}
      ccache_repo: ${{ steps.plan.outputs.ccache_repo }}
      merged_ccache_ref: ${{ steps.plan.outputs.merged_ccache_ref }}
      k1: ${{ steps.plan.outputs.k1 }}
      k2: ${{ steps.plan.outputs.k2 }}
      k3: ${{ steps.plan.outputs.k3 }}
      k4: ${{ steps.plan.outputs.k4 }}
      has_stub: ${{ steps.plan.outputs.has_stub }}
      has_merged_ccache: ${{ steps.plan.outputs.has_merged_ccache }}
      use_s2a_in_link: ${{ steps.plan.outputs.use_s2a_in_link }}
      incremental_link: ${{ steps.plan.outputs.incremental_link }}
      run_stage1: ${{ steps.plan.outputs.run_stage1 }}
      run_codegen: ${{ steps.plan.outputs.run_codegen }}
      run_shards: ${{ steps.plan.outputs.run_shards }}
      run_link: ${{ steps.plan.outputs.run_link }}
      run_package: ${{ steps.plan.outputs.run_package }}
      shards_json: ${{ steps.plan.outputs.shards_json }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute chained stage keys, probe GHCR checkpoints, and plan resume
        id: plan
        run: |
          chmod +x ./scripts/*.sh ./scripts/*.py
          ./scripts/oci_artifacts.sh exists "ghcr.io/oras-probe:none" >/dev/null 2>&1 || true
          export PATH="$HOME/.local/bin:$PATH"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          python3 - \
            "${{ github.repository }}" \
            "${{ inputs.build_mode }}" \
            "${{ inputs.force_from }}" \
            "${{ inputs.with_app_groups }}" \
            "${SHARD_COUNT}" \
            "$GITHUB_OUTPUT" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          repo, build_mode, force_from, with_app_groups, shard_count, gh_out = sys.argv[1:7]
          repo_lc = repo.lower()

          lock: dict[str, str] = {}
          for raw in pathlib.Path("version.lock").read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if "=" in line:
                  k, v = line.split("=", 1)
                  lock[k.strip()] = v.strip()

          chromium_rev = lock["CHROMIUM_REV"]
          chromium_version = lock["CHROMIUM_VERSION"]
          xcode_build = lock["XCODE_BUILD"]
          bundle_prefix = lock["BUNDLE_ID_PREFIX"]

          def hash_items(*parts: str | pathlib.Path) -> str:
              h = hashlib.sha256()
              for item in parts:
                  if isinstance(item, pathlib.Path):
                      if item.is_dir():
                          for sub in sorted(item.rglob("*")):
                              if sub.is_file():
                                  h.update(sub.as_posix().encode())
                                  h.update(b"\0")
                                  h.update(sub.read_bytes())
                                  h.update(b"\0")
                      elif item.is_file():
                          h.update(item.as_posix().encode())
                          h.update(b"\0")
                          h.update(item.read_bytes())
                          h.update(b"\0")
                  else:
                      h.update(str(item).encode())
                      h.update(b"\0")
              return h.hexdigest()[:20]

          stub_hash = hash_items(pathlib.Path("scripts/extract_xcode_stub.sh"))[:12]
          stub_tag = f"{xcode_build}-{stub_hash}"

          # Each stage key also hashes the YAML of the job(s) producing it, so
          # inline config (args.gn overlays, packing lists, ninja targets)
          # invalidates exactly the stages it affects and nothing upstream.
          workflow_lines = pathlib.Path(".github/workflows/build-ipa.yml").read_text(
              encoding="utf-8"
          ).splitlines(keepends=True)

          def job_yaml(job_id: str) -> str:
              start = None
              for i, line in enumerate(workflow_lines):
                  if start is None:
                      if line.rstrip() == f"  {job_id}:":
                          start = i
                  elif re.match(r"^  [A-Za-z0-9_-]+:\s*$", line):
                      return "".join(workflow_lines[start:i])
              if start is None:
                  sys.exit(f"::error::job '{job_id}' not found in build-ipa.yml")
              return "".join(workflow_lines[start:])

          # K1 covers every input that can change Stage 1 Swift/xcassets/ibtool outputs.
          k1 = hash_items(
              "stage1-v1",
              chromium_rev,
              xcode_build,
              bundle_prefix,
              pathlib.Path("patches"),
              pathlib.Path("args"),
              pathlib.Path("scripts/extract_xcode_stub.sh"),
              pathlib.Path("scripts/bootstrap_macos_host_tools.sh"),
              pathlib.Path("scripts/apply_patches.sh"),
              pathlib.Path("scripts/apple_tool_wrapper.py"),
              pathlib.Path("scripts/plan_shards.py"),
              job_yaml("apple-prebuild"),
          )
          # Codegen runs on Linux in parallel with Stage 1 and consumes only
          # the SDK stub, so its key is independent of K1 (Mac-only changes
          # never invalidate it).
          k2 = hash_items(
              "codegen-v2",
              chromium_rev,
              stub_tag,
              bundle_prefix,
              pathlib.Path("patches"),
              pathlib.Path("args"),
              pathlib.Path("scripts/apply_patches.sh"),
              pathlib.Path("scripts/apple_tool_wrapper.py"),
              pathlib.Path("scripts/plan_shards.py"),
              job_yaml("codegen"),
          )
          # KS marks a fully compiled shard farm (merged ccache complete), so a
          # link-only failure resumes at link instead of re-running the shards.
          ks = hash_items("shards-v1", k1, k2, shard_count, job_yaml("compile-shards"))
          k3 = hash_items("link-v2", ks, job_yaml("link"))
          k4 = hash_items(
              "package-v1",
              k3,
              with_app_groups,
              pathlib.Path("scripts/package_ipa.sh"),
              job_yaml("apple-package"),
          )

          src_ref = f"ghcr.io/{repo_lc}/chromium-ios-src:{chromium_rev}"
          stub_ref = f"ghcr.io/{repo_lc}/xcode-stub:{stub_tag}"
          s1_ref = f"ghcr.io/{repo_lc}/stage-cache:stage1-{k1}"
          s2a_ref = f"ghcr.io/{repo_lc}/stage-cache:codegen-{k2}"
          shards_ref = f"ghcr.io/{repo_lc}/stage-cache:shards-{ks}"
          s3_ref = f"ghcr.io/{repo_lc}/stage-cache:link-{k3}"
          ccache_repo = f"ghcr.io/{repo_lc}/chromium-ios-ccache"
          merged_ccache_ref = f"{ccache_repo}:{chromium_rev}"

          def oci_exists(ref: str) -> bool:
              r = subprocess.run(
                  ["./scripts/oci_artifacts.sh", "exists", ref],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return r.returncode == 0

          if not oci_exists(src_ref):
              print(f"::error::Source snapshot {src_ref} not found. Run 'Sync Pruned Source to GHCR' first.", file=sys.stderr)
              sys.exit(1)

          raw_has_stub = oci_exists(stub_ref)
          raw_has_s1 = oci_exists(s1_ref)
          raw_has_s2a = oci_exists(s2a_ref)
          raw_has_s3 = oci_exists(s3_ref)
          has_merged_ccache = oci_exists(merged_ccache_ref)
          raw_has_shards = has_merged_ccache and oci_exists(shards_ref)

          eff_s1 = raw_has_s1
          eff_s2a = raw_has_s2a
          eff_shards = raw_has_shards
          eff_s3 = raw_has_s3
          force_shards = False

          if force_from == "stage1":
              eff_s1 = eff_s2a = eff_shards = eff_s3 = False
              force_shards = True
          elif force_from == "codegen":
              eff_s2a = eff_shards = eff_s3 = False
              force_shards = True
          elif force_from == "shards":
              eff_shards = eff_s3 = False
              force_shards = True
          elif force_from == "link":
              eff_s3 = False
          elif force_from == "package":
              pass

          if build_mode == "incremental" and not has_merged_ccache:
              print(f"::warning::Requested 'incremental' but {merged_ccache_ref} is missing; falling back to 'auto'.")
              build_mode = "auto"

          run_package = True
          if eff_s3:
              run_link = False
              run_shards = False
              run_codegen = False
              run_stage1 = False
          else:
              run_link = True
              run_stage1 = not eff_s1
              # Warm per-shard buckets recompile only changed TUs across the
              # farm, so wall-clock stays bounded regardless of change size.
              # 'incremental' (serial, inside the link job) is opt-in only.
              if force_shards:
                  run_shards = True
              else:
                  run_shards = build_mode != "incremental" and not eff_shards
              run_codegen = run_shards and (not eff_s2a)

          use_s2a_in_link = run_codegen or eff_s2a
          # Only a link job that compiles real misses needs to refresh the
          # merged cache afterwards; a completed shard farm already pushed it.
          incremental_link = run_link and not run_shards and not eff_shards

          def bstr(v: bool) -> str:
              return "true" if v else "false"

          outputs = {
              "chromium_rev": chromium_rev,
              "chromium_version": chromium_version,
              "src_ref": src_ref,
              "stub_ref": stub_ref,
              "s1_ref": s1_ref,
              "s2a_ref": s2a_ref,
              "shards_ref": shards_ref,
              "s3_ref": s3_ref,
              "ccache_repo": ccache_repo,
              "merged_ccache_ref": merged_ccache_ref,
              "k1": k1,
              "k2": k2,
              "k3": k3,
              "k4": k4,
              "has_stub": bstr(raw_has_stub),
              "has_merged_ccache": bstr(has_merged_ccache),
              "use_s2a_in_link": bstr(use_s2a_in_link),
              "incremental_link": bstr(incremental_link),
              "run_stage1": bstr(run_stage1),
              "run_codegen": bstr(run_codegen),
              "run_shards": bstr(run_shards),
              "run_link": bstr(run_link),
              "run_package": bstr(run_package),
              "shards_json": json.dumps(list(range(int(shard_count)))),
          }

          with open(gh_out, "a", encoding="utf-8") as f:
              for k, v in outputs.items():
                  f.write(f"{k}={v}\n")

          summary = [
              "## Pipeline Checkpoint & Resume Plan",
              "",
              f"- **Chromium Revision**: `{chromium_rev[:12]}` (`{chromium_version}`)",
              f"- **Inputs**: `build_mode={build_mode}`, `force_from={force_from}`, `with_app_groups={with_app_groups}`",
              f"- **Warm Merged ccache (`{merged_ccache_ref}`)**: `{'HIT' if has_merged_ccache else 'MISS'}`",
              f"- **Xcode SDK Stub (`{stub_tag}`)**: `{'HIT' if raw_has_stub else 'MISS'}`",
              "",
              "| Stage | Key | GHCR Checkpoint | Action |",
              "| :--- | :--- | :--- | :--- |",
              f"| Stage 1 (`apple-prebuild`, Mac) | `{k1}` | `{'HIT' if raw_has_s1 else 'MISS'}` | **{'RUN' if run_stage1 else 'SKIP (reuse)'}** |",
              f"| Stage 2a (`codegen`, Linux, parallel to Stage 1) | `{k2}` | `{'HIT' if raw_has_s2a else 'MISS'}` | **{'RUN' if run_codegen else 'SKIP (reuse)'}** |",
              f"| Stage 2b (`compile-shards` × {shard_count}) | `{ks}` | `{'COMPLETE' if raw_has_shards else 'per-shard ccache'}` | **{'RUN' if run_shards else 'SKIP (merged ccache)'}** |",
              f"| Stage 3 (`link`) | `{k3}` | `{'HIT' if raw_has_s3 else 'MISS'}` | **{'RUN' if run_link else 'SKIP (reuse)'}** |",
              f"| Stage 4 (`apple-package`) | `{k4}` | `final IPA` | **{'RUN' if run_package else 'SKIP'}** |",
              "",
          ]
          summary_txt = "\n".join(summary)
          print(summary_txt)
          sf_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if sf_path:
              with open(sf_path, "a", encoding="utf-8") as sf:
                  sf.write(summary_txt + "\n")
          PY

  apple-prebuild:
    name: Stage 1 - Xcode 27 SDK Stub & Pre-Link Apple Targets
    needs: plan
    if: needs.plan.outputs.run_stage1 == 'true'
    runs-on: xcode-27
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim macOS runner disk space & install ORAS/zstd
        id: init
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          source ./version.lock
          df -h /
          target_app="$XCODE_APP"
          [ -e "$target_app" ] || target_app="/Applications/Xcode.app"
          keep_real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$target_app")"
          actual_build="$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1],"rb"))["ProductBuildVersion"])' "$keep_real/Contents/version.plist")"
          echo "Keeping Xcode at: $keep_real (ProductBuildVersion=$actual_build, expected=$XCODE_BUILD)"
          if [ "$actual_build" != "$XCODE_BUILD" ]; then
            echo "::warning::Runner Xcode build ($actual_build) differs from version.lock XCODE_BUILD ($XCODE_BUILD)"
          fi
          for app in /Applications/Xcode*; do
            [ -e "$app" ] || [ -L "$app" ] || continue
            app_real="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$app")"
            if [ "$app" = "$keep_real" ] || [ "$app" = "$target_app" ]; then
              continue
            fi
            if [ "$app_real" = "$keep_real" ] && [ -L "$app" ]; then
              continue
            fi
            sudo rm -rf "$app" || true
          done
          sudo rm -rf /Library/Developer/CoreSimulator /Users/runner/Library/Android || true
          df -h /

          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          command -v zstd >/dev/null 2>&1 || brew install zstd
          command -v ccache >/dev/null 2>&1 || brew install ccache
          ccache --version | head -n 1
          chmod +x ./scripts/*.sh ./scripts/*.py
          ./scripts/oci_artifacts.sh exists "ghcr.io/oras-probe:none" >/dev/null 2>&1 || true
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Restore or build encrypted Xcode 27 SDK stub (persisted immediately to GHCR)
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/s1_out"
          if [ "${{ needs.plan.outputs.has_stub }}" = "true" ]; then
            echo "==> Pulling cached Xcode SDK stub from ${{ needs.plan.outputs.stub_ref }}"
            ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.stub_ref }}" "$RUNNER_TEMP/s1_out"
          else
            ./scripts/extract_xcode_stub.sh --output-encrypted "$RUNNER_TEMP/s1_out/xcode_stub.tar.zst.enc"
            ./scripts/oci_artifacts.sh push \
              "${{ needs.plan.outputs.stub_ref }}" \
              "$RUNNER_TEMP/s1_out" \
              xcode_stub.tar.zst.enc \
              --repo "${{ github.repository }}"
          fi

      - name: Pull source, bootstrap mac-arm64 DEPS, run gn gen, and verify all inputs
        run: |
          source ./version.lock
          work="$RUNNER_TEMP/work"
          echo "==> [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Pulling source snapshot"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.src_ref }}" "$work"
          df -h /

          echo "==> [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Bootstrapping mac-arm64 host tools from src/DEPS"
          ./scripts/bootstrap_macos_host_tools.sh --work-dir "$work"
          ./scripts/apply_patches.sh --src-dir "$work/src"
          df -h /

          xcode_root="$XCODE_APP"
          [ -d "$xcode_root" ] || xcode_root="/Applications/Xcode.app"
          export DEVELOPER_DIR="$xcode_root/Contents/Developer"
          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0

          mkdir -p "$work/src/ci"
          cp ./scripts/apple_tool_wrapper.py "$work/src/ci/apple_tool_wrapper.py"

          out_dir="$work/src/out/Release"
          mkdir -p "$out_dir"
          cp ./args/device.gn "$out_dir/args.gn"
          cat >> "$out_dir/args.gn" <<EOF
          ios_app_bundle_id_prefix = "$BUNDLE_ID_PREFIX"
          apple_tool_wrapper = "//ci/apple_tool_wrapper.py"
          cc_wrapper = "ccache"
          EOF

          # Stage 1 compiles mac host tools (protoc, torque, mksnapshot, ...)
          # for the Swift targets' hard deps; a warm bucket makes re-runs and
          # post-timeout resumes cheap.
          mac_ccache_ref="${{ needs.plan.outputs.ccache_repo }}:${{ needs.plan.outputs.chromium_rev }}-mac"
          mkdir -p "$RUNNER_TEMP/ccache"
          if ./scripts/oci_artifacts.sh exists "$mac_ccache_ref"; then
            echo "==> Pulling warm mac host ccache from $mac_ccache_ref"
            ./scripts/oci_artifacts.sh pull "$mac_ccache_ref" "$RUNNER_TEMP"
          fi

          (cd "$work/src" && "$work/src/buildtools/mac/gn" gen out/Release)
          targets_file="$RUNNER_TEMP/apple_targets.txt"
          ./scripts/plan_shards.py \
            --ninja "$work/src/third_party/ninja/ninja" \
            --out-dir "$out_dir" \
            --mode apple-prebuild > "$targets_file"
          echo "==> Planned $(wc -l < "$targets_file") pre-link Apple targets"

          ./scripts/check_inputs.py \
            --ninja "$work/src/third_party/ninja/ninja" \
            --out-dir "$out_dir" \
            --targets-file "$targets_file"

      - name: Compile & record pre-link Apple targets
        id: compile
        timeout-minutes: 175
        run: |
          set -o pipefail
          source ./version.lock
          work="$RUNNER_TEMP/work"
          out_dir="$work/src/out/Release"
          xcode_root="$XCODE_APP"
          [ -d "$xcode_root" ] || xcode_root="/Applications/Xcode.app"
          export DEVELOPER_DIR="$xcode_root/Contents/Developer"
          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          export APPLE_TOOL_MODE=record
          export APPLE_TOOL_CACHE_DIR="$RUNNER_TEMP/apple_tool_cache"
          mkdir -p "$APPLE_TOOL_CACHE_DIR"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          export CCACHE_BASEDIR="$work"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_COMPILERCHECK="content"
          export CCACHE_SLOPPINESS="include_file_mtime,include_file_ctime,time_macros"
          export CCACHE_COMPRESS="true"
          export CCACHE_MAXSIZE="8G"
          ccache -z

          echo "==> [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Starting ninja on pre-link Apple targets"
          df -h /
          if [ -s "$RUNNER_TEMP/apple_targets.txt" ]; then
            tr '\n' '\0' < "$RUNNER_TEMP/apple_targets.txt" \
              | xargs -0 "$work/src/third_party/ninja/ninja" -C "$out_dir" \
              2>&1 | tee "$RUNNER_TEMP/ninja.log"
          fi
          echo "==> [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Finished pre-link Apple targets"
          df -h /

      - name: Persist Stage 1 checkpoint to GHCR
        if: steps.compile.outcome == 'success'
        run: |
          tar -C "$RUNNER_TEMP" -cf - apple_tool_cache \
            | zstd -T0 -5 -o "$RUNNER_TEMP/s1_out/apple_tool_cache.tar.zst"
          rm -rf "$RUNNER_TEMP/work"
          ./scripts/oci_artifacts.sh push \
            "${{ needs.plan.outputs.s1_ref }}" \
            "$RUNNER_TEMP/s1_out" \
            xcode_stub.tar.zst.enc \
            apple_tool_cache.tar.zst \
            --repo "${{ github.repository }}"

      - name: Always persist mac host ccache bucket to GHCR
        if: always() && steps.compile.outcome != 'skipped' && steps.compile.outcome != ''
        run: |
          rm -rf "$RUNNER_TEMP/work"
          if [ -d "$RUNNER_TEMP/ccache" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
            ./scripts/oci_artifacts.sh push \
              "${{ needs.plan.outputs.ccache_repo }}:${{ needs.plan.outputs.chromium_rev }}-mac" \
              "$RUNNER_TEMP" \
              ccache \
              --repo "${{ github.repository }}"
          fi

      - name: Write Stage 1 summary
        if: always()
        run: |
          ./scripts/write_job_summary.py \
            --title "Stage 1 — Xcode 27 Pre-Link Apple Targets" \
            --key "${{ needs.plan.outputs.k1 }}" \
            --checkpoint "${{ needs.plan.outputs.s1_ref }}" \
            --outcome "${{ steps.compile.outcome }}" \
            --start-epoch "${{ steps.init.outputs.start_epoch }}" \
            --ccache-dir "$RUNNER_TEMP/ccache" \
            --ninja-log "$RUNNER_TEMP/ninja.log"

  codegen:
    # Runs concurrently with Stage 1: it needs only the SDK stub (published by
    # Stage 1 within minutes on a new Xcode build) and doubles as the Linux
    # graph & missing-input preflight.
    name: Stage 2a - Host Tools, Rust Stdlib & Shared Codegen
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.run_codegen == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk & install tools
        id: init
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          chmod +x ./scripts/*.sh ./scripts/*.py
          ./scripts/reclaim_disk_linux.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd ccache
          ./scripts/oci_artifacts.sh exists "ghcr.io/oras-probe:none" >/dev/null 2>&1 || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pull source & SDK stub, warm codegen ccache, gn gen, & verify inputs
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          source ./version.lock
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          work="/tmp/cb_work"
          mkdir -p "$work" "$RUNNER_TEMP/stub"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.src_ref }}" "$work"
          ./scripts/apply_patches.sh --src-dir "$work/src"

          stub_ref="${{ needs.plan.outputs.stub_ref }}"
          for attempt in $(seq 1 60); do
            ./scripts/oci_artifacts.sh exists "$stub_ref" && break
            if [ "$attempt" -eq 60 ]; then
              echo "::error::SDK stub $stub_ref was not published by Stage 1 within 30 minutes"
              exit 1
            fi
            echo "==> Waiting for Stage 1 to publish $stub_ref ($attempt/60)"
            sleep 30
          done
          ./scripts/oci_artifacts.sh pull "$stub_ref" "$RUNNER_TEMP/stub"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -pass env:CI_ARTIFACT_KEY \
            -in "$RUNNER_TEMP/stub/xcode_stub.tar.zst.enc" \
            | zstd -d | tar -C "$work/src" -xf -
          rm -rf "$RUNNER_TEMP/stub"

          cg_ccache_ref="${{ needs.plan.outputs.ccache_repo }}:${{ needs.plan.outputs.chromium_rev }}-codegen"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$CCACHE_DIR"
          if ./scripts/oci_artifacts.sh exists "$cg_ccache_ref"; then
            echo "==> Pulling warm codegen ccache from $cg_ccache_ref"
            ./scripts/oci_artifacts.sh pull "$cg_ccache_ref" "$RUNNER_TEMP"
          fi
          ccache -M 0
          ccache -z

          mkdir -p "$work/src/ci" "$work/src/out/Release"
          cp ./scripts/apple_tool_wrapper.py "$work/src/ci/apple_tool_wrapper.py"
          cp ./args/device.gn "$work/src/out/Release/args.gn"
          cat >> "$work/src/out/Release/args.gn" <<EOF
          ios_app_bundle_id_prefix = "$BUNDLE_ID_PREFIX"
          ios_sdk_developer_dir = "//xcode_stub"
          apple_tool_wrapper = "//ci/apple_tool_wrapper.py"
          cc_wrapper = "ccache"
          EOF

          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          (cd "$work/src" && gn gen out/Release)

          ./scripts/check_inputs.py \
            --ninja "$work/src/third_party/ninja/ninja" \
            --out-dir "$work/src/out/Release" \
            --targets chrome

          ./scripts/plan_shards.py \
            --ninja "$work/src/third_party/ninja/ninja" \
            --out-dir "$work/src/out/Release" \
            --mode codegen > "$RUNNER_TEMP/codegen_targets.txt"
          echo "==> Planned $(wc -l < "$RUNNER_TEMP/codegen_targets.txt") host/Rust/codegen targets"

      - name: Build host tools, Rust stdlib, V8 snapshot, & generated headers
        id: compile
        timeout-minutes: 135
        run: |
          set -o pipefail
          work="/tmp/cb_work"
          out_dir="$work/src/out/Release"
          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          # Stage 1 runs concurrently, so no Apple tool outputs exist here. The
          # few targets downstream of Swift/xcassets/ibtool (e.g. merged
          # Info.plists) fail fast as replay misses and are built later by the
          # shards/link, which restore Stage 1's recordings.
          export APPLE_TOOL_MODE=replay
          export APPLE_TOOL_CACHE_DIR="$RUNNER_TEMP/apple_tool_cache_empty"
          mkdir -p "$APPLE_TOOL_CACHE_DIR"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          export CCACHE_BASEDIR="$work"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_CPP2="true"
          export CCACHE_COMPILERCHECK="content"
          export CCACHE_SLOPPINESS="include_file_mtime,include_file_ctime,time_macros"
          export CCACHE_COMPRESS="true"
          export CCACHE_MAXSIZE="0"

          rc=0
          if [ -s "$RUNNER_TEMP/codegen_targets.txt" ]; then
            tr '\n' '\0' < "$RUNNER_TEMP/codegen_targets.txt" \
              | xargs -0 -r -s 1048576 "$work/src/third_party/ninja/ninja" -C "$out_dir" -k 0 \
              2>&1 | tee "$RUNNER_TEMP/ninja.log" || rc=$?
          fi

          if [ "$rc" -ne 0 ]; then
            # Accept the run only if every failed edge is a deferred Apple tool.
            python3 - "$RUNNER_TEMP/ninja.log" <<'PY'
          import sys

          lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          deferred, real = [], []
          for i, line in enumerate(lines):
              if line.startswith("FAILED: "):
                  cmd = lines[i + 1] if i + 1 < len(lines) else ""
                  (deferred if "apple_tool_wrapper" in cmd else real).append(line[len("FAILED: "):])
          print(f"==> {len(deferred)} Apple tool edge(s) deferred to shards/link")
          for item in deferred[:40]:
              print(f"  deferred: {item}")
          if real or not deferred:
              print(f"::error::{len(real)} non-Apple codegen failure(s); see FAILED blocks above", file=sys.stderr)
              sys.exit(1)
          PY
          fi

          pending="$(tr '\n' '\0' < "$RUNNER_TEMP/codegen_targets.txt" \
            | xargs -0 -r -s 1048576 "$work/src/third_party/ninja/ninja" -C "$out_dir" -n 2>/dev/null \
            | grep -c '^\[' || true)"
          echo "==> ${pending} codegen edge(s) left for shards/link (downstream of Apple outputs)" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Persist Stage 2a codegen checkpoint to GHCR
        if: steps.compile.outcome == 'success'
        run: |
          out_dir="/tmp/cb_work/src/out/Release"
          mkdir -p "$RUNNER_TEMP/s2a_out"
          (
            cd "$out_dir"
            pack_items=(gen .ninja_deps .ninja_log)
            [ -d obj ] && pack_items+=(obj)
            [ -d local_rustc_sysroot ] && pack_items+=(local_rustc_sysroot)
            for hd in clang_x64*; do
              [ -d "$hd" ] && pack_items+=("$hd")
            done
            tar -cf - "${pack_items[@]}" | zstd -T0 -4 -o "$RUNNER_TEMP/s2a_out/codegen_gen.tar.zst"
          )
          rm -rf /tmp/cb_work
          ./scripts/oci_artifacts.sh push \
            "${{ needs.plan.outputs.s2a_ref }}" \
            "$RUNNER_TEMP/s2a_out" \
            codegen_gen.tar.zst \
            --repo "${{ github.repository }}"
          rm -rf "$RUNNER_TEMP/s2a_out"

      - name: Always persist codegen ccache bucket to GHCR
        if: always()
        run: |
          rm -rf /tmp/cb_work
          if [ -d "$RUNNER_TEMP/ccache" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
            cg_ccache_ref="${{ needs.plan.outputs.ccache_repo }}:${{ needs.plan.outputs.chromium_rev }}-codegen"
            ./scripts/oci_artifacts.sh push \
              "$cg_ccache_ref" \
              "$RUNNER_TEMP" \
              ccache \
              --repo "${{ github.repository }}"
          fi

      - name: Write Stage 2a summary
        if: always()
        run: |
          ./scripts/write_job_summary.py \
            --title "Stage 2a — Host Tools, Rust Stdlib & Shared Codegen" \
            --key "${{ needs.plan.outputs.k2 }}" \
            --checkpoint "${{ needs.plan.outputs.s2a_ref }}" \
            --outcome "${{ steps.compile.outcome }}" \
            --start-epoch "${{ steps.init.outputs.start_epoch }}" \
            --ccache-dir "$RUNNER_TEMP/ccache" \
            --ninja-log "$RUNNER_TEMP/ninja.log"

  compile-shards:
    name: Stage 2b - C/C++/ObjC++ Shard ${{ matrix.shard }}
    needs: [plan, apple-prebuild, codegen]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_shards == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk & install tools
        id: init
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          chmod +x ./scripts/*.sh ./scripts/*.py
          ./scripts/reclaim_disk_linux.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd ccache
          ./scripts/oci_artifacts.sh exists "ghcr.io/oras-probe:none" >/dev/null 2>&1 || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pull source, Stage 1 & Stage 2a checkpoints, & warm shard ccache
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          source ./version.lock
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          work="/tmp/cb_work"
          mkdir -p "$work" "$RUNNER_TEMP/s1" "$RUNNER_TEMP/s2a"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.src_ref }}" "$work"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.s1_ref }}" "$RUNNER_TEMP/s1"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.s2a_ref }}" "$RUNNER_TEMP/s2a"
          ./scripts/apply_patches.sh --src-dir "$work/src"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -pass env:CI_ARTIFACT_KEY \
            -in "$RUNNER_TEMP/s1/xcode_stub.tar.zst.enc" \
            | zstd -d | tar -C "$work/src" -xf -
          zstd -dc "$RUNNER_TEMP/s1/apple_tool_cache.tar.zst" | tar -C "$RUNNER_TEMP" -xf -
          rm -rf "$RUNNER_TEMP/s1"

          shard_ccache_ref="${{ needs.plan.outputs.ccache_repo }}:${{ needs.plan.outputs.chromium_rev }}-shard-${{ matrix.shard }}"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$CCACHE_DIR"
          if ./scripts/oci_artifacts.sh exists "$shard_ccache_ref"; then
            echo "==> Pulling warm shard ccache from $shard_ccache_ref"
            ./scripts/oci_artifacts.sh pull "$shard_ccache_ref" "$RUNNER_TEMP"
          fi
          ccache -M 0
          ccache -z

          mkdir -p "$work/src/ci" "$work/src/out/Release"
          cp ./scripts/apple_tool_wrapper.py "$work/src/ci/apple_tool_wrapper.py"
          cp ./args/device.gn "$work/src/out/Release/args.gn"
          cat >> "$work/src/out/Release/args.gn" <<EOF
          ios_app_bundle_id_prefix = "$BUNDLE_ID_PREFIX"
          ios_sdk_developer_dir = "//xcode_stub"
          apple_tool_wrapper = "//ci/apple_tool_wrapper.py"
          cc_wrapper = "ccache"
          EOF

          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          (cd "$work/src" && gn gen out/Release)
          zstd -dc "$RUNNER_TEMP/s2a/codegen_gen.tar.zst" | tar -C "$work/src/out/Release" -xf -
          rm -rf "$RUNNER_TEMP/s2a"

          ./scripts/plan_shards.py \
            --ninja "$work/src/third_party/ninja/ninja" \
            --out-dir "$work/src/out/Release" \
            --mode c-shard \
            --shard-count "${SHARD_COUNT}" \
            --shard-index "${{ matrix.shard }}" > "$RUNNER_TEMP/shard_targets.txt"
          echo "==> Planned $(wc -l < "$RUNNER_TEMP/shard_targets.txt") objects for shard ${{ matrix.shard }} (SHA-1 modulo)"

      - name: Compile shard ${{ matrix.shard }} objects
        id: compile
        timeout-minutes: 155
        run: |
          set -o pipefail
          work="/tmp/cb_work"
          out_dir="$work/src/out/Release"
          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          export APPLE_TOOL_MODE=replay
          export APPLE_TOOL_CACHE_DIR="$RUNNER_TEMP/apple_tool_cache"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          export CCACHE_BASEDIR="$work"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_CPP2="true"
          export CCACHE_COMPILERCHECK="content"
          export CCACHE_SLOPPINESS="include_file_mtime,include_file_ctime,time_macros"
          export CCACHE_COMPRESS="true"
          export CCACHE_MAXSIZE="0"

          if [ -s "$RUNNER_TEMP/shard_targets.txt" ]; then
            tr '\n' '\0' < "$RUNNER_TEMP/shard_targets.txt" \
              | xargs -0 -r -s 1048576 "$work/src/third_party/ninja/ninja" -C "$out_dir" -k 0 \
              2>&1 | tee "$RUNNER_TEMP/ninja.log"
          fi

      - name: Always persist shard ${{ matrix.shard }} ccache bucket to GHCR
        if: always()
        run: |
          rm -rf /tmp/cb_work
          if [ -d "$RUNNER_TEMP/ccache" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
            shard_ccache_ref="${{ needs.plan.outputs.ccache_repo }}:${{ needs.plan.outputs.chromium_rev }}-shard-${{ matrix.shard }}"
            ./scripts/oci_artifacts.sh push \
              "$shard_ccache_ref" \
              "$RUNNER_TEMP" \
              ccache \
              --repo "${{ github.repository }}"
          fi

      - name: Write shard ${{ matrix.shard }} summary
        if: always()
        run: |
          ./scripts/write_job_summary.py \
            --title "Stage 2b — Compile Shard ${{ matrix.shard }}" \
            --key "sha1-mod-${SHARD_COUNT}:shard-${{ matrix.shard }}" \
            --checkpoint "${{ needs.plan.outputs.ccache_repo }}:${{ needs.plan.outputs.chromium_rev }}-shard-${{ matrix.shard }}" \
            --outcome "${{ steps.compile.outcome }}" \
            --start-epoch "${{ steps.init.outputs.start_epoch }}" \
            --ccache-dir "$RUNNER_TEMP/ccache" \
            --ninja-log "$RUNNER_TEMP/ninja.log"

  link:
    name: Stage 3 - Persist Merged ccache & Link Chromium.app
    needs: [plan, apple-prebuild, codegen, compile-shards]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_link == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 215
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk & install tools (swap deferred until pre-link)
        id: init
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          chmod +x ./scripts/*.sh ./scripts/*.py
          ./scripts/reclaim_disk_linux.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd ccache rsync
          ./scripts/oci_artifacts.sh exists "ghcr.io/oras-probe:none" >/dev/null 2>&1 || true
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Assemble codegen + shard ccache buckets & push merged ccache to GHCR BEFORE linking
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          mkdir -p "$CCACHE_DIR"

          if [ "${{ needs.plan.outputs.run_shards }}" = "true" ]; then
            tags=("${{ needs.plan.outputs.chromium_rev }}-codegen")
            for (( i = 0; i < SHARD_COUNT; i++ )); do
              tags+=("${{ needs.plan.outputs.chromium_rev }}-shard-${i}")
            done
            # Pull 4 buckets concurrently, merge, delete, repeat: bounded disk
            # peak with ~4x faster assembly than one-at-a-time.
            batch=4
            echo "==> [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Pulling ${#tags[@]} ccache buckets from GHCR, ${batch} at a time"
            for (( b = 0; b < ${#tags[@]}; b += batch )); do
              dirs=()
              pids=()
              for tag in "${tags[@]:b:batch}"; do
                d="$(mktemp -d)"
                dirs+=("$d")
                ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.ccache_repo }}:${tag}" "$d" &
                pids+=("$!")
              done
              for pid in "${pids[@]}"; do
                wait "$pid"
              done
              for d in "${dirs[@]}"; do
                rsync -a --ignore-existing "$d/ccache/" "$CCACHE_DIR/"
                rm -rf "$d"
              done
              echo "  merged: ${tags[*]:b:batch}"
            done

            ccache -M 0
            echo "==> Merged ccache total (persisting to ${{ needs.plan.outputs.merged_ccache_ref }} BEFORE ld64.lld):"
            du -sh "$CCACHE_DIR"
            df -h / /mnt 2>/dev/null || df -h /

            ./scripts/oci_artifacts.sh push \
              "${{ needs.plan.outputs.merged_ccache_ref }}" \
              "$RUNNER_TEMP" \
              ccache \
              --repo "${{ github.repository }}"

            # Mark this shard farm complete so a link-only failure resumes here.
            mkdir -p "$RUNNER_TEMP/shards_marker"
            echo "${{ needs.plan.outputs.shards_ref }}" > "$RUNNER_TEMP/shards_marker/complete.txt"
            ./scripts/oci_artifacts.sh push \
              "${{ needs.plan.outputs.shards_ref }}" \
              "$RUNNER_TEMP/shards_marker" \
              complete.txt \
              --repo "${{ github.repository }}"
          elif [ "${{ needs.plan.outputs.has_merged_ccache }}" = "true" ]; then
            echo "==> Pulling warm merged ccache from ${{ needs.plan.outputs.merged_ccache_ref }}"
            ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.merged_ccache_ref }}" "$RUNNER_TEMP"
            ccache -M 0
            du -sh "$CCACHE_DIR"
          fi

      - name: Stage source, Stage 1/2a checkpoints, input scan, & adaptive swapfile
        env:
          CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
        run: |
          source ./version.lock
          work="/tmp/cb_work"
          mkdir -p "$work" "$RUNNER_TEMP/s1"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.src_ref }}" "$work"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.s1_ref }}" "$RUNNER_TEMP/s1"
          ./scripts/apply_patches.sh --src-dir "$work/src"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -pass env:CI_ARTIFACT_KEY \
            -in "$RUNNER_TEMP/s1/xcode_stub.tar.zst.enc" \
            | zstd -d | tar -C "$work/src" -xf -
          zstd -dc "$RUNNER_TEMP/s1/apple_tool_cache.tar.zst" | tar -C "$RUNNER_TEMP" -xf -
          rm -rf "$RUNNER_TEMP/s1"

          mkdir -p "$work/src/ci" "$work/src/out/Release"
          cp ./scripts/apple_tool_wrapper.py "$work/src/ci/apple_tool_wrapper.py"
          cp ./args/device.gn "$work/src/out/Release/args.gn"
          cat >> "$work/src/out/Release/args.gn" <<EOF
          ios_app_bundle_id_prefix = "$BUNDLE_ID_PREFIX"
          ios_sdk_developer_dir = "//xcode_stub"
          apple_tool_wrapper = "//ci/apple_tool_wrapper.py"
          cc_wrapper = "ccache"
          EOF

          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          (cd "$work/src" && gn gen out/Release)

          if [ "${{ needs.plan.outputs.use_s2a_in_link }}" = "true" ]; then
            mkdir -p "$RUNNER_TEMP/s2a"
            ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.s2a_ref }}" "$RUNNER_TEMP/s2a"
            zstd -dc "$RUNNER_TEMP/s2a/codegen_gen.tar.zst" | tar -C "$work/src/out/Release" -xf -
            rm -rf "$RUNNER_TEMP/s2a"
          fi

          ./scripts/check_inputs.py \
            --ninja "$work/src/third_party/ninja/ninja" \
            --out-dir "$work/src/out/Release" \
            --targets chrome

          ./scripts/reclaim_disk_linux.sh --swap-only 16

      - name: Link Chromium.app via ld64.lld
        id: link_chrome
        timeout-minutes: 145
        run: |
          set -o pipefail
          work="/tmp/cb_work"
          out_dir="$work/src/out/Release"
          export PATH="$work/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          export APPLE_TOOL_MODE=replay
          export APPLE_TOOL_CACHE_DIR="$RUNNER_TEMP/apple_tool_cache"
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          export CCACHE_BASEDIR="$work"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_CPP2="true"
          export CCACHE_COMPILERCHECK="content"
          export CCACHE_SLOPPINESS="include_file_mtime,include_file_ctime,time_macros"
          export CCACHE_COMPRESS="true"
          export CCACHE_MAXSIZE="0"

          ccache -z
          echo "==> [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Building & linking target 'chrome'"
          "$work/src/third_party/ninja/ninja" -C "$out_dir" chrome \
            2>&1 | tee "$RUNNER_TEMP/ninja.log"
          echo "==> [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Link finished"

      - name: Persist Stage 3 unsigned app checkpoint to GHCR
        if: steps.link_chrome.outcome == 'success'
        run: |
          ./scripts/reclaim_disk_linux.sh --drop-swap
          out_dir="/tmp/cb_work/src/out/Release"
          stage_out="$RUNNER_TEMP/linked_stage"
          s3_out="$RUNNER_TEMP/s3_out"
          mkdir -p "$stage_out" "$s3_out"

          mv "$out_dir/Chromium.app" "$stage_out/Chromium.app"
          if [ -d "$out_dir/.deferred_extract_metadata" ]; then
            mv "$out_dir/.deferred_extract_metadata" "$stage_out/.deferred_extract_metadata"
          fi
          tar -C "$stage_out" -cf - . | zstd -T0 -5 -o "$s3_out/chromium_app_unsigned.tar.zst"
          rm -rf /tmp/cb_work "$stage_out"

          ./scripts/oci_artifacts.sh push \
            "${{ needs.plan.outputs.s3_ref }}" \
            "$s3_out" \
            chromium_app_unsigned.tar.zst \
            --repo "${{ github.repository }}"

      # Incremental runs compile misses inside the link job; persist them even
      # when the link fails or times out so the next attempt makes progress.
      # (A completed shard farm already pushed the merged cache before linking.)
      - name: Always refresh merged ccache after incremental compile
        if: >-
          always() &&
          needs.plan.outputs.incremental_link == 'true' &&
          steps.link_chrome.outcome != 'skipped' &&
          steps.link_chrome.outcome != ''
        run: |
          ./scripts/reclaim_disk_linux.sh --drop-swap || true
          rm -rf /tmp/cb_work
          if [ -d "$RUNNER_TEMP/ccache" ]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
            ./scripts/oci_artifacts.sh push \
              "${{ needs.plan.outputs.merged_ccache_ref }}" \
              "$RUNNER_TEMP" \
              ccache \
              --repo "${{ github.repository }}"
          fi

      - name: Release swap & write Stage 3 summary
        if: always()
        run: |
          ./scripts/reclaim_disk_linux.sh --drop-swap || true
          rm -rf /tmp/cb_work
          ./scripts/write_job_summary.py \
            --title "Stage 3 — Link Chromium.app & Merged ccache" \
            --key "${{ needs.plan.outputs.k3 }}" \
            --checkpoint "${{ needs.plan.outputs.s3_ref }}" \
            --outcome "${{ steps.link_chrome.outcome }}" \
            --start-epoch "${{ steps.init.outputs.start_epoch }}" \
            --ccache-dir "$RUNNER_TEMP/ccache" \
            --ninja-log "$RUNNER_TEMP/ninja.log"

  apple-package:
    name: Stage 4 - Finalize AppIntents Metadata & Package IPA
    needs: [plan, link]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_package == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pull Stage 3 checkpoint from GHCR & package IPA
        id: pkg
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          command -v zstd >/dev/null 2>&1 || brew install zstd
          chmod +x ./scripts/*.sh ./scripts/*.py
          ./scripts/oci_artifacts.sh exists "ghcr.io/oras-probe:none" >/dev/null 2>&1 || true
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          source ./version.lock
          mkdir -p "$RUNNER_TEMP/s3" "$RUNNER_TEMP/work/src/out/Release"
          ./scripts/oci_artifacts.sh pull "${{ needs.plan.outputs.s3_ref }}" "$RUNNER_TEMP/s3"
          zstd -dc "$RUNNER_TEMP/s3/chromium_app_unsigned.tar.zst" \
            | tar -C "$RUNNER_TEMP/work/src/out/Release" -xf -
          rm -rf "$RUNNER_TEMP/s3"

          extra_flags=()
          if [ "${{ inputs.with_app_groups }}" = "true" ]; then
            extra_flags+=(--with-app-groups)
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          ./scripts/package_ipa.sh \
            --src-dir "$RUNNER_TEMP/work/src" \
            --out-rel "out/Release" \
            --output-ipa "$GITHUB_WORKSPACE/dist/Chromium-Blink-${CHROMIUM_VERSION}-arm64.ipa" \
            "${extra_flags[@]}"

      - name: Upload final IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-Blink-${{ needs.plan.outputs.chromium_version }}-arm64
          path: |
            dist/*.ipa
            dist/*.ipa.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source ./version.lock
          tag="v${CHROMIUM_VERSION}-r${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            dist/*.ipa \
            dist/*.ipa.sha256 \
            --clobber \
            --title "Chromium Blink iOS ${CHROMIUM_VERSION} (Build #${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned arm64 iOS build with Blink engine (\`use_blink = true\`), built from Chromium \`${CHROMIUM_REV:0:12}\`."

      - name: Write Stage 4 summary
        if: always()
        run: |
          ./scripts/write_job_summary.py \
            --title "Stage 4 — Finalize AppIntents Metadata & Package IPA" \
            --key "${{ needs.plan.outputs.k4 }}" \
            --checkpoint "${{ needs.plan.outputs.s3_ref }}" \
            --outcome "${{ steps.pkg.outcome }}" \
            --start-epoch "${{ steps.pkg.outputs.start_epoch }}"
