name: Build Chromium Blink iOS IPA
run-name: IPA · ${{ github.ref_name }} · build ${{ github.run_number }}

# Orchestration only: every stage runs scripts/stage.sh, and its checkpoint key
# comes from scripts/plan_pipeline.py (inputs by content, never this YAML).
#
#   0 SDK stub (Mac) -> 1 Codegen (Linux) -> 2 Apple tools (Mac)
#     -> 3 Compile x 18 (Linux, parallel) -> 4 Link (Linux) -> 5 Package (Mac)
#
# Finished stages and shards are reused across runs; a new run only does the
# work whose checkpoint is missing. To rebuild a stage on purpose, bump its
# epoch in ci/epochs.json.
#
# Only a stage's build and checkpoint steps decide its outcome; ccache uploads
# and summaries are best-effort and never block the stages after it.

on:
  workflow_dispatch:
    inputs:
      with_app_groups:
        description: "Ad-hoc sign IPA with App Group entitlements"
        type: boolean
        default: false
      publish_release:
        description: "Publish built IPA to GitHub Releases"
        type: boolean
        default: false
      inject_failure:
        description: "Recovery test: fail on purpose (shard 0 before/after its checkpoint, or link before linking)"
        type: choice
        options: [none, shard-before-commit, shard-after-commit, link]
        default: none
      shards:
        description: "Rescue: build only these compile shards (e.g. 15 or 3,15), beside a running build; stops before link"
        type: string
        default: ""

# Every workflow that writes GHCR checkpoints shares this group. A shard rescue
# writes only its own shards' tags, so it runs in a group of its own.
concurrency:
  group: ${{ inputs.shards == '' && 'ghcr-writes' || format('ghcr-shards-{0}', inputs.shards) }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ORAS_USER: ${{ github.actor }}

jobs:
  preflight:
    name: Preflight - source & SDK
    runs-on: ubuntu-24.04
    outputs:
      stub_tag: ${{ steps.preflight.outputs.stub_tag }}
      need_sdk: ${{ steps.preflight.outputs.need_sdk }}
    steps:
      - uses: actions/checkout@v5
      - id: preflight
        run: ./scripts/stage.sh plan preflight

  sdk:
    name: 0 SDK stub (Mac)
    needs: preflight
    if: needs.preflight.outputs.need_sdk == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      STUB_TAG: ${{ needs.preflight.outputs.stub_tag }}
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/stage.sh sdk run

  plan:
    name: Plan
    needs: [preflight, sdk]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      chromium_rev: ${{ steps.plan.outputs.chromium_rev }}
      chromium_version: ${{ steps.plan.outputs.chromium_version }}
      src_ref: ${{ steps.plan.outputs.src_ref }}
      stub_ref: ${{ steps.plan.outputs.stub_ref }}
      codegen_ref: ${{ steps.plan.outputs.codegen_ref }}
      apple_ref: ${{ steps.plan.outputs.apple_ref }}
      compile_prefix: ${{ steps.plan.outputs.compile_prefix }}
      link_ref: ${{ steps.plan.outputs.link_ref }}
      ccache_repo: ${{ steps.plan.outputs.ccache_repo }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shards_json: ${{ steps.plan.outputs.shards_json }}
      run_codegen: ${{ steps.plan.outputs.run_codegen }}
      run_apple: ${{ steps.plan.outputs.run_apple }}
      run_compile: ${{ steps.plan.outputs.run_compile }}
      run_link: ${{ steps.plan.outputs.run_link }}
      run_package: ${{ steps.plan.outputs.run_package }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        env:
          WITH_APP_GROUPS: ${{ inputs.with_app_groups }}
          ONLY_SHARDS: ${{ inputs.shards }}
        run: ./scripts/stage.sh plan run

  codegen:
    name: 1 Codegen (Linux)
    needs: plan
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_codegen == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    env:
      JOB_TIMEOUT_MIN: 165
      PERSIST_RESERVE_MIN: 15
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      CCACHE_REPO: ${{ needs.plan.outputs.ccache_repo }}
      CHROMIUM_REV: ${{ needs.plan.outputs.chromium_rev }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh codegen check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh codegen init
      - name: Prepare tree, plan & audit
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh codegen prepare
      - name: Check bundled probe in the patched source snapshot
        if: steps.check.outputs.done != 'true'
        run: python3 scripts/check_remote_patches.py --patched-source /tmp/cb_work/src
      - id: build
        name: Build host tools, Rust & generated files
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh codegen build
      - name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh codegen persist
      - name: Persist ccache bucket
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: ./scripts/stage.sh codegen persist-cache
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "1 Codegen (Linux)"
          --checkpoint "$CODEGEN_REF" --key "${CODEGEN_REF##*:}" --outcome "${{ steps.build.outcome }}"
          --start-epoch "${JOB_START:-0}" --ccache-dir "$RUNNER_TEMP/ccache" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  apple:
    name: 2 Apple tools (Mac)
    needs: [plan, codegen]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_apple == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      JOB_TIMEOUT_MIN: 120
      PERSIST_RESERVE_MIN: 10
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh apple check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh apple init
      - name: Prepare tree & reduce graph to Apple edges
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh apple prepare
      - id: build
        name: Run & record Apple tools
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh apple build
      - name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh apple persist
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "2 Apple tools (Mac)"
          --checkpoint "$APPLE_REF" --key "${APPLE_REF##*:}" --outcome "${{ steps.build.outcome }}"
          --start-epoch "${JOB_START:-0}" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  compile:
    name: 3 Compile shard ${{ matrix.shard }} (Linux)
    needs: [plan, codegen, apple]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_compile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards_json) }}
    env:
      JOB_TIMEOUT_MIN: 185
      PERSIST_RESERVE_MIN: 20
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
      COMPILE_PREFIX: ${{ needs.plan.outputs.compile_prefix }}
      CCACHE_REPO: ${{ needs.plan.outputs.ccache_repo }}
      CHROMIUM_REV: ${{ needs.plan.outputs.chromium_rev }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      SHARD_INDEX: ${{ matrix.shard }}
      INJECT_FAILURE: ${{ inputs.inject_failure }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh compile check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh compile init
      - name: Prepare tree & plan shard
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh compile prepare
      - id: build
        name: Compile shard objects
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh compile build
      - name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh compile persist
      - name: Persist ccache bucket
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: ./scripts/stage.sh compile persist-cache
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "3 Compile shard ${{ matrix.shard }}"
          --checkpoint "$COMPILE_PREFIX-${{ matrix.shard }}" --key "${COMPILE_PREFIX##*:}-${{ matrix.shard }}"
          --outcome "${{ steps.build.outcome }}" --start-epoch "${JOB_START:-0}"
          --ccache-dir "$RUNNER_TEMP/ccache" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  link:
    name: 4 Link (Linux)
    needs: [plan, codegen, apple, compile]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_link == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOB_TIMEOUT_MIN: 180
      PERSIST_RESERVE_MIN: 15
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      SRC_REF: ${{ needs.plan.outputs.src_ref }}
      STUB_REF: ${{ needs.plan.outputs.stub_ref }}
      CODEGEN_REF: ${{ needs.plan.outputs.codegen_ref }}
      APPLE_REF: ${{ needs.plan.outputs.apple_ref }}
      COMPILE_PREFIX: ${{ needs.plan.outputs.compile_prefix }}
      LINK_REF: ${{ needs.plan.outputs.link_ref }}
      SHARD_COUNT: ${{ needs.plan.outputs.shard_count }}
      INJECT_FAILURE: ${{ inputs.inject_failure }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: ./scripts/stage.sh link check
      - if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh link init
      - name: Prepare tree & import verified shard objects
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh link prepare
      - id: build
        name: Link Chromium.app
        if: steps.check.outputs.done != 'true'
        run: ./scripts/stage.sh link build
      - name: Persist checkpoint
        if: steps.build.outcome == 'success'
        run: ./scripts/stage.sh link persist
      - name: Upload engine symbols
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: Chromium-Blink-${{ needs.plan.outputs.chromium_version }}-arm64-symbols
          path: ${{ runner.temp }}/stage/symbols/
          if-no-files-found: warn
          retention-days: 30
      - name: Summary
        continue-on-error: true
        if: always() && steps.check.outputs.done == 'false'
        run: >-
          ./scripts/write_job_summary.py --title "4 Link (Linux)"
          --checkpoint "$LINK_REF" --key "${LINK_REF##*:}" --outcome "${{ steps.build.outcome }}"
          --start-epoch "${JOB_START:-0}" --ninja-log "$RUNNER_TEMP/stage/ninja.log"

  package:
    name: 5 Package IPA (Mac)
    needs: [plan, link]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.run_package == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      LINK_REF: ${{ needs.plan.outputs.link_ref }}
      CHROMIUM_VERSION: ${{ needs.plan.outputs.chromium_version }}
      WITH_APP_GROUPS: ${{ inputs.with_app_groups }}
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/stage.sh package run
      - uses: actions/upload-artifact@v6
        with:
          name: Chromium-Blink-${{ needs.plan.outputs.chromium_version }}-arm64
          path: |
            dist/*.ipa
            dist/*.ipa.sha256
          retention-days: 30
      - name: Publish GitHub Release
        if: inputs.publish_release == true
        run: |
          tag="v${CHROMIUM_VERSION}-r${GITHUB_RUN_NUMBER}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Chromium Blink iOS ${CHROMIUM_VERSION} (Build #${GITHUB_RUN_NUMBER})" \
            --notes "Unsigned arm64 iOS build with Blink engine, Chromium ${{ needs.plan.outputs.chromium_rev }}."
          gh release upload "$tag" dist/*.ipa dist/*.ipa.sha256 --clobber
