name: Probe Chromium build graph
run-name: ${{ inputs.compile_extensions && 'Extension object probe' || 'GN probe' }} · ${{ github.ref_name }} · ${{ inputs.extra_gn_args || 'baseline' }}

# Prepares the Linux tree exactly as the codegen stage does (scripts/stage.sh),
# then plans codegen without compiling and audits the stage contract.
# An opt-in probe compiles core and iOS client objects on Linux, without linking.
# Both modes compare graphs with a baseline and upload graphs and reports.

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Run ID of an earlier diagnosis whose artifact is the comparison baseline (blank to skip)
        default: "43868838103"
        type: string
      extra_gn_args:
        description: Extra GN args appended to args.gn (newline or semicolon separated)
        default: ""
        type: string
      compile_extensions:
        description: Compile extension core and iOS client objects after graph checks (no link)
        default: false
        type: boolean
      comparison_mode:
        description: Report feature changes, or require identical graphs for a refactor
        default: report
        type: choice
        options: [report, identical]

permissions:
  contents: read
  packages: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ORAS_USER: ${{ github.actor }}

jobs:
  diagnose:
    name: Graph audit and optional extension object probe
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_ARTIFACT_KEY: ${{ secrets.CI_ARTIFACT_KEY }}
      BASELINE_RUN: ${{ inputs.baseline_run }}
      EXTRA_GN_ARGS: ${{ inputs.extra_gn_args }}
      COMPILE_EXTENSIONS: ${{ inputs.compile_extensions }}
      GRAPH_COMPARISON_MODE: ${{ inputs.comparison_mode }}
      JOB_TIMEOUT_MIN: 60
      PERSIST_RESERVE_MIN: 10
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/stage.sh plan refs
      - name: Record probe identity
        id: identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from hashlib import sha256
          from pathlib import Path

          fields = (
              "GITHUB_REF", "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
              "SRC_REF", "STUB_REF", "EXTRA_GN_ARGS", "COMPILE_EXTENSIONS",
              "GRAPH_COMPARISON_MODE",
          )
          identity = {field: os.environ.get(field, "") for field in fields}
          report = Path(os.environ["RUNNER_TEMP"]) / "graph-diagnosis" / "probe-context.json"
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps(identity, indent=2) + "\n")
          scope = sha256((os.environ["SRC_REF"] + "\n" + os.environ["STUB_REF"]).encode()).hexdigest()[:20]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"cache_scope={scope}\n")
          PY
      - run: ./scripts/stage.sh diagnose init
      - name: Prepare tree (snapshots raw and pruned graphs)
        run: ./scripts/stage.sh diagnose prepare

      - name: Plan codegen & audit against the stage contract
        run: |
          art="$RUNNER_TEMP/graph-diagnosis"
          out_dir=/tmp/cb_work/src/out/Release
          ./scripts/plan_shards.py --ninja /tmp/cb_work/src/third_party/ninja/ninja \
            --out-dir "$out_dir" --mode codegen > "$art/codegen_targets.txt"
          ./scripts/diagnose_graph.py --out-dir "$out_dir" --roots-file "$art/codegen_targets.txt" \
            --write-filtered "$art/codegen_targets_filtered.txt" --report "$art/report.txt" \
            --expect gen/ios/chrome/browser/shared/ui/buildflags.h --check
          { echo "### Codegen plan audit"; echo '```text'; head -c 60000 "$art/report.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with baseline
        if: success() && inputs.baseline_run != ''
        shell: bash
        run: |
          gh run download "$BASELINE_RUN" -R "$GITHUB_REPOSITORY" -n graph-diagnosis -D "$RUNNER_TEMP/baseline"
          comparison_args=()
          if [ "$GRAPH_COMPARISON_MODE" = report ]; then
            comparison_args+=(--allow-differences)
          fi
          python3 ./scripts/compare_graphs.py --baseline "$RUNNER_TEMP/baseline" --current "$RUNNER_TEMP/graph-diagnosis" \
            "${comparison_args[@]}" \
            | tee "$RUNNER_TEMP/graph-diagnosis/baseline_compare.txt"
          { echo "### Compared with run $BASELINE_RUN"; echo '```text'
            cat "$RUNNER_TEMP/graph-diagnosis/baseline_compare.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore probe compiler cache
        if: inputs.compile_extensions
        id: probe_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ runner.os }}-extensions-${{ steps.identity.outputs.cache_scope }}-${{ hashFiles('ci/ccache.env') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-extensions-${{ steps.identity.outputs.cache_scope }}-${{ hashFiles('ci/ccache.env') }}-

      - name: Compile extension core and iOS client objects (Linux)
        if: inputs.compile_extensions
        env:
          PROBE_CACHE_RESTORED: ${{ steps.probe_cache.outputs.cache-matched-key != '' }}
        run: ./scripts/stage.sh probe compile

      - name: Upload graphs & reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: graph-diagnosis
          path: ${{ runner.temp }}/graph-diagnosis/
          retention-days: 14
          if-no-files-found: warn

      - name: Save compiler progress, including failed probes
        if: always() && inputs.compile_extensions && env.PROBE_BUILD_STARTED == 'true'
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.probe_cache.outputs.cache-primary-key }}
