<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extension filter check</title>
<style>
  :root { color-scheme: light dark; font: 1rem system-ui; }
  body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  button { min-height: 44px; font: inherit; padding: 0.5rem 1rem; }
  pre { white-space: pre-wrap; }
</style>
<h1>Extension filter check</h1>
<p>Site: <strong id="site"></strong></p>
<p>The test loads two harmless scripts. One path matches an EasyList rule in uBlock Origin Lite.</p>
<button id="run" type="button">Run filter check</button>
<pre id="result" role="status" aria-live="polite"></pre>
<script>
  const run = document.querySelector('#run');
  const result = document.querySelector('#result');
  document.querySelector('#site').textContent = location.host;

  function load(path, nonce) {
    return new Promise(resolve => {
      const script = document.createElement('script');
      function finish(outcome) {
        clearTimeout(timer);
        script.remove();
        resolve(outcome);
      }
      const timer = setTimeout(() => finish('timed out'), 5000);
      script.onload = () => finish('loaded');
      script.onerror = () => finish('did not load');
      script.src = `${path}?check=${nonce}`;
      document.head.append(script);
    });
  }

  run.addEventListener('click', async () => {
    run.disabled = true;
    result.textContent = 'Checking requests…';
    const nonce = crypto.randomUUID();
    const [control, target] = await Promise.all([
      load('/control.js', nonce),
      load('/xpopup/xpopup.js', nonce),
    ]);
    result.textContent = `Control: ${control}\nEasyList target: ${target}\nRequest ID: ${nonce}`;
    run.disabled = false;
  });
</script>
</html>
