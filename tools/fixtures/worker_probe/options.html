<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worker Probe Options</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 20px; line-height: 1.45; background: #f8f9fb; color: #111827; }
    .card { background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    code, pre { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all; }
    button { font-size: 15px; padding: 10px 14px; border-radius: 10px; border: 1px solid #2563eb; background: #2563eb; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <h2 id="title">Worker Probe Options</h2>
  <div class="card">
    <div>Origin: <code id="origin">pending</code></div>
    <div>Runtime ID: <code id="runtime-id">pending</code></div>
    <div>Ping Status: <code id="ping-status">pending</code></div>
    <div>Module Marker: <code id="module-marker">pending</code></div>
    <div>Boot Count: <code id="boot-count">pending</code></div>
    <div>Echo Nonce: <code id="echo-nonce">pending</code></div>
    <div>Commands: <pre id="commands">pending</pre></div>
    <div>Last Command Event: <pre id="last-command">pending</pre></div>
  </div>
  <div class="card">
    <button id="reping" type="button">Ping Service Worker</button>
  </div>
  <script src="options.js"></script>
</body>
</html>
